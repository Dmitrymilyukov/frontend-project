<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>light & dark</title>
</head>
    <body>
        <div class="container">
            <div class="container__inner">
                <div class="checkbox">
                    <p class="mode">Dark mode:</p>
                    <input type="checkbox">
                </div>
                <h1>
                    The entire page color theme is controlled using CSS and JavaScript
                </h1>
            </div>
            <div class="checkbox">
                <p class="mode">Contained dark mode:</p>
                <input type="checkbox">
            </div>
            <div class="container__inner square">
                <h1>
                    The container color scheme is controlled by only CSS
                </h1>
            </div>
        </div>
    </body>
</html>
